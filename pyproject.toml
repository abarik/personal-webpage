[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qmd2pw"
version = "0.1.0"
description = "Render a standalone Quarto (.qmd) document as a bilingual, single-page personal website for university lecturers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abari Kálmán" }]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qmd2pw = "qmd2pw.cli:main"

[tool.setuptools.package-data]
qmd2pw = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
